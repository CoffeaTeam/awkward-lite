name: Build wheels

on:
  workflow_call:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-wheels-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  SOURCE_DATE_EPOCH: "1668811211"

# Builds the sdist and the wheels for every platform and CPython version that
# cibuildwheel builds by default (including free-threaded 3.14t and 3.15t), and
# tests each wheel with the compiled-kernel tests. Nothing is published.
jobs:
  build_sdist:
    name: "Build sdist"
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Build sdist
      run: uv build --sdist

    - name: Check metadata
      run: uvx twine check dist/*

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sdist
        path: dist/*.tar.gz

  build_wheels:
    name: "Build wheels: ${{ matrix.os }} ${{ matrix.archs }} ${{ matrix.build }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, archs: auto64, build: "*-manylinux_*"}
          - {os: ubuntu-latest, archs: auto64, build: "*-musllinux_*"}
          - {os: ubuntu-24.04-arm, archs: auto64, build: "*-manylinux_*"}
          - {os: ubuntu-24.04-arm, archs: auto64, build: "*-musllinux_*"}
          - {os: macos-15, archs: auto64, build: "*"}
          - {os: macos-15-intel, archs: auto64, build: "*"}
          - {os: windows-latest, archs: auto64, build: "*"}
          - {os: windows-latest, archs: auto32, build: "*"}
          - {os: windows-11-arm, archs: auto64, build: "*"}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
      env:
        CIBW_ARCHS: ${{ matrix.archs }}
        CIBW_BUILD: ${{ matrix.build }}

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: wheels-${{ strategy.job-index }}
        path: wheelhouse/*.whl

  build_pyodide_wheels:
    name: "Build wheels: pyodide"
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    # numpy cannot be imported in the cross-compiling build environment, so the
    # build cannot generate the kernel tests that the wheels are tested with
    - name: Generate kernel tests
      run: uvx nox -s prepare -- --tests

    - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
      env:
        CIBW_PLATFORM: pyodide

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: wheels-pyodide
        path: wheelhouse/*.whl
