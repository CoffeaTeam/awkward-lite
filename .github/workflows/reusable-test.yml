name: Tests

on:
  schedule:
    - cron: 0 12 1 * *

  workflow_call:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'test-${{ github.head_ref || github.run_id }}'
  cancel-in-progress: true

env:
  # The C++ code is compiled through ccache, which is cached between runs.
  # Only runs on main save the cache; pull requests restore it.
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CMAKE_GENERATOR: Ninja
  # A constant timestamp keeps the generated kernels.h, which every kernel
  # includes, identical between runs
  SOURCE_DATE_EPOCH: "1668811211"

jobs:
  run-tests:
    name: Run Tests
    if: github.event_name != 'schedule' || github.repository_owner == 'CoffeaTeam'
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - windows-latest
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
        python-version:
          - '3.15'
          - '3.11'
        python-architecture:
          - '' # use default arch
        dependencies-kind:
          - full
        include:
          - python-version: '3.15'
            python-architecture: arm64
            runs-on: macos-15
            dependencies-kind: full
          - python-version: '3.15'
            python-architecture: x64
            runs-on: macos-15-intel
            dependencies-kind: basic
          - python-version: '3.11'
            python-architecture: x86
            runs-on: windows-latest
            dependencies-kind: full
          - python-version: '3.11'
            python-architecture: x64
            runs-on: ubuntu-latest
            dependencies-kind: minimal
          - python-version: '3.11'
            python-architecture: arm64
            runs-on: macos-15
            dependencies-kind: ml
          - python-version: '3.14t'
            python-architecture: x64
            runs-on: ubuntu-latest
            dependencies-kind: nogil
          - python-version: '3.14t'
            python-architecture: arm64
            runs-on: macos-15
            dependencies-kind: nogil
          - python-version: '3.14t'
            python-architecture: x64
            runs-on: windows-latest
            dependencies-kind: nogil

    runs-on: ${{ matrix.runs-on }}

    env:
      PIP_ONLY_BINARY: numpy,pandas,pyarrow,numexpr,numexpr
      MACOSX_DEPLOYMENT_TARGET: ${{ startsWith(matrix.runs-on, 'macos') && '11.0' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: 'Python ${{ matrix.python-version }}'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '${{ matrix.python-version }}'
          architecture: '${{ matrix.python-architecture }}'
          allow-prereleases: true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@e91f31892a1d1b8c44424b1a94c0b7f52d337168 # v1.2.26
        with:
          key: ${{ github.job }}-${{ matrix.runs-on }}-${{ matrix.python-version }}-${{ matrix.python-architecture }}
          save: ${{ github.event_name != 'pull_request' }}

      # ccache needs a Ninja build with the MSVC environment on Windows
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: ${{ matrix.python-architecture == 'x86' && 'x86' || 'x64' }}

      - name: Install awkward and dependencies
        run: >-
          python -m pip install -v . pytest-github-actions-annotate-failures
          -r "requirements-test-${MATRIX_DEPENDENCIES_KIND}.txt"
        shell: bash
        env:
          MATRIX_DEPENDENCIES_KIND: ${{ matrix.dependencies-kind }}

      - name: Print versions
        run: python -m pip list

      # Not with xdist: these tests are too short for it to pay off
      - name: Test specification and CPU kernels
        run: >-
          python -m pytest -vv -rs
          tests-spec tests-spec-explicit
          tests-cpu-kernels tests-cpu-kernels-explicit

      - name: Test non-kernels (Python)
        run: >-
          python -m pytest -n auto -vv -rs tests

      - name: Test non-kernels (Python) in multiple threads
        if: matrix.python-version == '3.14t'
        run: |
          python -m pip install 'pytest-run-parallel>=0.8.2'
          python -m pytest -n auto -vv -rs tests --parallel-threads 4 --ignore=tests/test_3364_virtualarray.py --ignore=tests/test_3475_virtualarray_unknown_length.py

  Linux-ROOT:
    name: Linux ROOT
    if: github.event_name != 'schedule' || github.repository_owner == 'CoffeaTeam'
    runs-on: ubuntu-latest

    env:
      PIP_ONLY_BINARY: numpy,pandas,pyarrow,numexpr,numexpr

    timeout-minutes: 30

    # Required for miniconda to activate conda
    defaults:
      run:
        shell: "bash -l {0}"

    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Setup Python via Conda
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          # Only save caches from main; PR runs would create per-PR entries
          cache-environment: ${{ github.event_name != 'pull_request' }}
          environment-name: awkward
          create-args: >-
            python=3.14
            numpy
            root

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@e91f31892a1d1b8c44424b1a94c0b7f52d337168 # v1.2.26
        with:
          key: ${{ github.job }}
          save: ${{ github.event_name != 'pull_request' }}

      - name: Install awkward and dependencies
        run: >-
          python -m pip install --only-binary "numpy,pandas,pyarrow,numexpr"
          -v . pytest-github-actions-annotate-failures
          -r requirements-test-full.txt

      - name: Print versions
        run: python -m pip list

      - name: Test
        run: python -m pytest -n auto -vv -rs tests

  Linux-cppyy:
    name: Linux cppyy
    if: github.event_name != 'schedule' || github.repository_owner == 'CoffeaTeam'
    # TODO: remove this part of the workflow
    # cppyy is not yet released. Let's load some pre-built wheels via docker (as a binary store)
    runs-on: ubuntu-22.04

    env:
      PIP_ONLY_BINARY: numpy,pandas,pyarrow,numexpr,numexpr

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@e91f31892a1d1b8c44424b1a94c0b7f52d337168 # v1.2.26
        with:
          key: ${{ github.job }}
          save: ${{ github.event_name != 'pull_request' }}

      - name: Extract pre-built manylinux cppyy wheels
        uses: shrink/actions-docker-extract@f1ef61065b78731fe3310b4e84e511f6a927a77e # v4.0.0
        with:
          image: "docker.io/agoose77/cppyy-wheels:cp311"
          path: "/wheels/."
          destination: "/tmp/wheelhouse"

      - name: Install awkward and dependencies
        run: >-
          python -m pip install -v --only-binary "numpy,pandas,pyarrow,numexpr"
          . /tmp/wheelhouse/* pytest-github-actions-annotate-failures

      - name: Print versions
        run: python -m pip list

      - name: Test
        run: python -m pytest -vv -rs tests -k cppyy
