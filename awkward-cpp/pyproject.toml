[build-system]
requires = [
    "scikit-build-core>=1.0",
    "pybind11>=3",
]
build-backend = "scikit_build_core.build"

[project]
name = "awkward_cpp"
version = "58"
dependencies = [
    "numpy>=2"
]
readme = "README.md"
description = "CPU kernels and compiled extensions for Awkward Array"
authors = [
    {name = "Awkward Array Lite developers"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
license = "BSD-3-Clause AND MIT"
license-files = ["LICENSE", "rapidjson/license.txt"]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/CoffeaTeam/awkward-lite"
"Source Code" = "https://github.com/CoffeaTeam/awkward-lite"
"Bug Tracker" = "https://github.com/CoffeaTeam/awkward-lite/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{cache_tag}"
sdist.reproducible = true
# Run CMake configure before packing the sdist so that the generated artefacts
# below are created from the repository sources and shipped in the sdist.
sdist.cmake = true
sdist.include = [
    "/header-only",
    "/include/awkward/kernels.h",
    "/src/awkward_cpp/_kernel_signatures.py",
    "/tests-spec",
    "/tests-spec-explicit",
    "/tests-cpu-kernels",
    "/tests-cpu-kernels-explicit"
]
sdist.exclude = [
  "rapidjson/bin",
]

[[tool.scikit-build.overrides]]
if.platform-system = "darwin"
cmake.version = ">=3.29"

# Generating the kernel artefacts (only possible and only needed when building
# from the repository, not from an sdist) needs pyyaml and numpy.
[[tool.scikit-build.overrides]]
if.from-sdist = false
build.requires = ["pyyaml", "numpy"]

# Rebuild the editable workspace install when the C++ sources or the kernel
# spec change, not only when pyproject.toml changes.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "include/**/*.h" },
    { file = "src/**/*.cpp" },
    { file = "src/**/*.py" },
    { file = "../header-only/**/*.h" },
    { file = "../dev/*.py" },
    { file = "../kernel-specification.yml" },
    { file = "../kernel-test-data.json" },
]

[tool.cibuildwheel]
build-frontend = "build[uv]"
skip = [
    "cp310-win_arm64",  # No numpy wheels
]
build-verbosity = 1

[tool.cibuildwheel.environment]
PIP_ONLY_BINARY = "cmake,numpy"
UV_ONLY_BINARY = "cmake,numpy"

[[tool.cibuildwheel.overrides]]
select = "*-win*"
repair-wheel-command = "delvewheel repair -w {dest_dir} -v --ignore-existing {wheel}"

[[tool.cibuildwheel.overrides]]
select = "*pyodide*"
build-frontend = {name = "build", args = ["--exports", "whole_archive"]}

# Use older manylinux for Python 3.10
[[tool.cibuildwheel.overrides]]
select = "cp310-manylinux*"
manylinux-x86_64-image = "manylinux2014"
